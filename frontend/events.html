<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events - School Event Notification</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/events.css">
</head>
<body>
  <div class="container">
    <header class="navbar">
      <h1>School Events</h1>
      <div class="navbar-actions">
        <button id="darkModeToggle" class="btn btn-secondary">🌙 Dark Mode</button>
        <button id="logoutBtn" class="btn btn-secondary">Logout</button>
      </div>
    </header>

    <main class="content">
      <div class="events-container">
        <h2>Upcoming Events</h2>
        <div id="eventsList" class="events-list">
          <p class="loading">Loading events...</p>
        </div>
      </div>

      <!-- Attendance Modal -->
      <div id="attendanceModal" class="modal">
        <div class="modal-content">
          <span class="close">&times;</span>
          <h3>Mark Attendance</h3>
          <form id="attendanceForm">
            <input type="hidden" id="attendanceEventId" name="eventId">
            <div class="form-group">
              <label for="studentName">Full Name</label>
              <input type="text" id="studentName" name="studentName" required placeholder="Enter your full name">
            </div>
            <div class="form-group">
              <label for="section">Section</label>
              <input type="text" id="section" name="section" required placeholder="Enter your section">
            </div>
            <div class="form-group">
              <label for="yearLevel">Year Level</label>
              <select id="yearLevel" name="yearLevel" required>
                <option value="">Select year level</option>
                <option value="1st Year">1st Year</option>
                <option value="2nd Year">2nd Year</option>
                <option value="3rd Year">3rd Year</option>
                <option value="4th Year">4th Year</option>
              </select>
            </div>
            <div class="form-group">
              <label for="attendanceImage">Upload Attendance Photo</label>
              <input type="file" id="attendanceImage" name="attendanceImage" accept="image/*" required>
            </div>
            <button type="submit" class="btn btn-primary">Submit Attendance</button>
          </form>
        </div>
      </div>
    </main>
  </div>

  <div id="successMessage" class="success-message"></div>
  <div id="errorMessage" class="error-message"></div>

  <script src="/js/events.js"></script>
</body>
</html>
